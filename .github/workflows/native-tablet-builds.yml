# 태블릿 네이티브 빌드 - 갤럭시탭(APK, Linux 러너)과 아이패드(iOS, macOS 러너).
#
# 트리거: 수동(workflow_dispatch) 또는 태그 `tablet-v*` 푸시. 매 커밋마다 돌리지 않는 이유는
# macOS 러너가 Linux의 10배 요금이라서(비공개 저장소 기준).
#
# 결과물(Actions > 해당 실행 > Artifacts):
#   - qstory-tablet-android-debug.apk : 갤럭시탭에 바로 설치 가능(디버그 키 서명). 개발자 옵션 >
#     USB 디버깅 또는 파일 전송 후 "출처를 알 수 없는 앱 허용"으로 설치.
#   - qstory-tablet-android-release.apk : ANDROID_KEYSTORE_* 시크릿이 있으면 서명본, 없으면 unsigned.
#   - qstory-tablet-ios-simulator.app.zip : 아이패드 시뮬레이터용(Mac에서 xcrun simctl install).
#   - qstory-tablet-ios.ipa : IOS_* 시크릿(인증서·프로비저닝 프로파일)이 있을 때만. 실제 아이패드
#     설치는 이 IPA를 TestFlight(App Store Connect) 또는 Ad Hoc 프로파일의 기기에 올려서 한다.
#
# 시크릿(모두 선택):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64,
#   IOS_TEAM_ID, IOS_EXPORT_METHOD (ad-hoc | app-store | development, 기본 ad-hoc)
name: native-tablet-builds

on:
  workflow_dispatch:
  push:
    tags: ['tablet-v*']

concurrency:
  group: native-tablet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (갤럭시탭)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # step의 if 조건에서는 secrets 컨텍스트를 직접 못 쓴다 - job env로 한 번 옮겨서 판단한다.
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Build web (native mode) and sync
        run: npm run cap:sync
      - name: Restore release keystore (optional)
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.jks
          cat > android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Gradle assemble
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Collect APKs
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/qstory-tablet-android-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/qstory-tablet-android-release.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/qstory-tablet-android-release-unsigned.apk
          fi
          ls -la build-output
      - uses: actions/upload-artifact@v4
        with:
          name: qstory-tablet-android
          path: build-output/*.apk
          if-no-files-found: error

  ios:
    name: iOS (아이패드)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_IOS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Build web (native mode) and sync
        run: npm run cap:sync
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/App/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift') }}
      # 1) 시뮬레이터 빌드 - 서명 불필요. 아이패드 시뮬레이터에서 화면·흐름 확인용.
      - name: Build for iPad simulator
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          test -d build/Build/Products/Debug-iphonesimulator/App.app
          cd build/Build/Products/Debug-iphonesimulator && zip -r "$GITHUB_WORKSPACE/qstory-tablet-ios-simulator.app.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: qstory-tablet-ios-simulator
          path: qstory-tablet-ios-simulator.app.zip
      # 2) 실기기용 IPA - 인증서·프로파일 시크릿이 있을 때만.
      - name: Import signing certificate and profile
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/qstory.mobileprovision
      - name: Archive and export IPA
        if: env.HAS_IOS_SIGNING == 'true'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -archivePath build/App.xcarchive DEVELOPMENT_TEAM="$TEAM_ID" archive
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export
          cp build/export/*.ipa "$GITHUB_WORKSPACE/qstory-tablet-ios.ipa"
      - uses: actions/upload-artifact@v4
        if: env.HAS_IOS_SIGNING == 'true'
        with:
          name: qstory-tablet-ios-ipa
          path: qstory-tablet-ios.ipa
