# 태블릿 네이티브 빌드 - 갤럭시탭(APK, Linux 러너)과 아이패드(iOS, macOS 러너).
#
# 트리거: 수동(workflow_dispatch) 또는 태그 `tablet-v*` 푸시. 매 커밋마다 돌리지 않는 이유는
# macOS 러너가 Linux의 10배 요금이라서(비공개 저장소 기준).
#
# 결과물(Actions > 해당 실행 > Artifacts):
#   - qstory-tablet-android-debug.apk : 갤럭시탭에 바로 설치 가능(디버그 키 서명). 개발자 옵션 >
#     USB 디버깅 또는 파일 전송 후 "출처를 알 수 없는 앱 허용"으로 설치.
#   - qstory-tablet-android-release.apk : ANDROID_KEYSTORE_* 시크릿이 있으면 서명본, 없으면 unsigned.
#   - qstory-tablet-ios-simulator.app.zip : 아이패드 시뮬레이터용(Mac에서 xcrun simctl install).
#   - qstory-tablet-ios.ipa : IOS_* 시크릿(인증서·프로비저닝 프로파일)이 있을 때만. 실제 아이패드
#     설치는 이 IPA를 TestFlight(App Store Connect) 또는 Ad Hoc 프로파일의 기기에 올려서 한다.
#
# 시크릿(모두 선택):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64,
#   IOS_TEAM_ID, IOS_EXPORT_METHOD (ad-hoc | app-store | development, 기본 ad-hoc)
#   APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8_BASE64 : IOS_EXPORT_METHOD가
#     app-store이고 이 셋이 있으면 IPA를 TestFlight(App Store Connect)에 바로 올린다.
#   FIREBASE_ANDROID_APP_ID, FIREBASE_SERVICE_ACCOUNT_JSON : 둘 다 있으면 Android APK를 Firebase App
#     Distribution으로 테스터 그룹에 배포한다(안드로이드판 TestFlight). 설정 절차는 docs/native-build.md
#     "갤럭시탭 - 테스터에게 나눠주기" 참고. 없으면 Artifacts 다운로드만 된다.
#   GOOGLE_SERVICES_JSON : Firebase 콘솔의 Android 앱(kr.ai.qstory) google-services.json 내용. FCM 푸시용.
#     없으면 위 서비스 계정으로 받아 오고, 그것도 안 되면 푸시 없이 빌드한다.
#   iOS의 GoogleService-Info.plist(FCM 푸시용)도 같은 FIREBASE_SERVICE_ACCOUNT_JSON으로 Firebase에서 받아 온다
#     (번들 id kr.ai.qstory인 iOS 앱). 못 받으면 푸시 없이 빌드한다.
name: native-tablet-builds

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: '테스터에게 보낼 한 줄 메모 (Firebase App Distribution). 비우면 커밋 메시지'
        required: false
        default: ''
      tester_groups:
        description: 'Firebase 테스터 그룹 alias (쉼표 구분)'
        required: false
        default: 'tablet-testers'
  push:
    tags: ['tablet-v*']

concurrency:
  group: native-tablet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (갤럭시탭)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # step의 if 조건에서는 secrets 컨텍스트를 직접 못 쓴다 - job env로 한 번 옮겨서 판단한다.
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.FIREBASE_ANDROID_APP_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Build web (native mode) and sync
        run: npm run cap:sync:android
      # FCM 푸시에는 android/app/google-services.json이 필요하다(app/build.gradle은 파일이 있을 때만
      # google-services 플러그인을 적용한다). 비밀 값이라 커밋하지 않고 여기서 만든다:
      #   1) GOOGLE_SERVICES_JSON 시크릿이 있으면 그대로 쓰고,
      #   2) 없으면 App Distribution용 서비스 계정으로 Firebase에서 받아 오고,
      #   3) 둘 다 안 되면 경고만 남기고 푸시 없이 빌드를 계속한다(빌드는 절대 깨지지 않게).
      - name: Prepare google-services.json (FCM push, optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          target=android/app/google-services.json
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$target"
            echo "google-services.json: GOOGLE_SERVICES_JSON 시크릿 사용"
          elif [ -n "$FIREBASE_ANDROID_APP_ID" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            sa="$RUNNER_TEMP/firebase-sa.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$sa"
            project_id=$(jq -r '.project_id // empty' "$sa")
            if GOOGLE_APPLICATION_CREDENTIALS="$sa" npx -y firebase-tools@latest apps:sdkconfig ANDROID \
                "$FIREBASE_ANDROID_APP_ID" --project "$project_id" --json > "$RUNNER_TEMP/sdkconfig.json" 2> "$RUNNER_TEMP/sdkconfig.err" \
              && jq -er '.result.fileContents' "$RUNNER_TEMP/sdkconfig.json" > "$target"; then
              echo "google-services.json: 서비스 계정으로 Firebase에서 받아 옴"
            else
              rm -f "$target"
              echo "::warning::google-services.json을 받아 오지 못했다 - 푸시 없이 빌드한다. GOOGLE_SERVICES_JSON 시크릿을 넣으면 해결된다."
              # 에러 메시지만 남긴다(설정 파일 내용은 찍지 않는다).
              tail -n 5 "$RUNNER_TEMP/sdkconfig.err" || true
            fi
            rm -f "$sa" "$RUNNER_TEMP/sdkconfig.json"
          else
            echo "::warning::GOOGLE_SERVICES_JSON·Firebase 시크릿이 없어 푸시 없이 빌드한다."
          fi
          if [ -f "$target" ]; then
            pkg=$(jq -r '[.client[].client_info.android_client_info.package_name] | join(",")' "$target" 2>/dev/null || echo '?')
            echo "google-services.json 패키지: $pkg (applicationId는 kr.ai.qstory여야 한다)"
          fi
      - name: Restore release keystore (optional)
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.jks
          cat > android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Gradle assemble
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Collect APKs
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/qstory-tablet-android-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/qstory-tablet-android-release.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/qstory-tablet-android-release-unsigned.apk
          fi
          ls -la build-output
      - uses: actions/upload-artifact@v4
        with:
          name: qstory-tablet-android
          path: build-output/*.apk
          if-no-files-found: error
      # --- Firebase App Distribution (안드로이드판 TestFlight) -----------------------------
      # 서명된 release가 있으면 그것을, 없으면 debug APK를 올린다 - 둘 다 갤럭시탭에 설치된다.
      # 테스터는 초대 메일의 링크로 Firebase "App Tester" 앱을 깔고 거기서 설치·업데이트한다.
      - name: Pick APK to distribute
        if: env.HAS_FIREBASE == 'true'
        id: pick
        run: |
          if [ -f build-output/qstory-tablet-android-release.apk ]; then
            echo "file=build-output/qstory-tablet-android-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "file=build-output/qstory-tablet-android-debug.apk" >> "$GITHUB_OUTPUT"
          fi
          notes="${{ github.event.inputs.release_notes }}"
          if [ -z "$notes" ]; then
            notes="$(git log -1 --pretty=%s) ($(git rev-parse --short HEAD))"
          fi
          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Distribute to testers (Firebase App Distribution)
        if: env.HAS_FIREBASE == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ github.event.inputs.tester_groups || 'tablet-testers' }}
          file: ${{ steps.pick.outputs.file }}
          releaseNotes: ${{ steps.pick.outputs.notes }}

  ios:
    name: iOS (아이패드)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_IOS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' }}
      HAS_APPSTORE_API: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 != '' }}
      EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Build web (native mode) and sync
        run: npm run cap:sync
      # FCM 푸시(iOS)에는 ios/App/App/GoogleService-Info.plist가 필요하다. 비밀 값이라 커밋하지 않고 안드로이드의
      # google-services.json처럼 서비스 계정으로 Firebase에서 받아 온다. 파일이 없으면 Xcode의 복사 단계가
      # 건너뛰고 AppDelegate도 Firebase를 켜지 않는다 - 경고만 남기고 푸시 없이 빌드를 계속한다.
      - name: Prepare GoogleService-Info.plist (FCM push, optional)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          IOS_BUNDLE_ID: kr.ai.qstory
        run: |
          target=ios/App/App/GoogleService-Info.plist
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            sa="$RUNNER_TEMP/firebase-sa.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$sa"
            project_id=$(jq -r '.project_id // empty' "$sa")
            app_id=""
            if GOOGLE_APPLICATION_CREDENTIALS="$sa" npx -y firebase-tools@latest apps:list IOS                 --project "$project_id" --json > "$RUNNER_TEMP/apps.json" 2> "$RUNNER_TEMP/apps.err"; then
              app_id=$(jq -r --arg b "$IOS_BUNDLE_ID"                 '[.result[] | select(.bundleId == $b or .namespace == $b) | .appId][0] // empty' "$RUNNER_TEMP/apps.json")
            else
              tail -n 5 "$RUNNER_TEMP/apps.err" || true
            fi
            if [ -n "$app_id" ] && GOOGLE_APPLICATION_CREDENTIALS="$sa" npx -y firebase-tools@latest apps:sdkconfig IOS                 "$app_id" --project "$project_id" --json > "$RUNNER_TEMP/sdkconfig.json" 2> "$RUNNER_TEMP/sdkconfig.err"               && jq -er '.result.fileContents' "$RUNNER_TEMP/sdkconfig.json" > "$target"; then
              echo "GoogleService-Info.plist: 서비스 계정으로 Firebase에서 받아 옴"
            else
              rm -f "$target"
              echo "::warning::GoogleService-Info.plist를 받아 오지 못했다(번들 id $IOS_BUNDLE_ID인 Firebase iOS 앱) - 푸시 없이 빌드한다."
              # 에러 메시지만 남긴다(설정 파일 내용은 찍지 않는다).
              tail -n 5 "$RUNNER_TEMP/sdkconfig.err" 2>/dev/null || true
            fi
            rm -f "$sa" "$RUNNER_TEMP/apps.json" "$RUNNER_TEMP/sdkconfig.json"
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON 시크릿이 없어 iOS는 푸시 없이 빌드한다."
          fi
          if [ -f "$target" ]; then
            bid=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$target" 2>/dev/null || echo '?')
            echo "GoogleService-Info.plist 번들 id: $bid (kr.ai.qstory여야 한다)"
          fi
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/App/build/SourcePackages
          # Firebase iOS SDK는 CapApp-SPM이 아니라 App.xcodeproj에 걸려 있어 pbxproj도 키에 넣는다.
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'ios/App/App.xcodeproj/project.pbxproj') }}
      # 1) 시뮬레이터 빌드 - 서명 불필요. 아이패드 시뮬레이터에서 화면·흐름 확인용.
      - name: Build for iPad simulator
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          test -d build/Build/Products/Debug-iphonesimulator/App.app
          cd build/Build/Products/Debug-iphonesimulator && zip -r "$GITHUB_WORKSPACE/qstory-tablet-ios-simulator.app.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: qstory-tablet-ios-simulator
          path: qstory-tablet-ios-simulator.app.zip
      # 2) 실기기용 IPA - 인증서·프로파일 시크릿이 있을 때만.
      - name: Import signing certificate and profile
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/qstory.mobileprovision
      - name: Archive and export IPA
        if: env.HAS_IOS_SIGNING == 'true'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # 프로파일의 내부 Name(파일명이 아니라 <key>Name</key>)을 뽑아 CODE_SIGN 오버라이드에 쓴다 -
          # pbxproj의 CODE_SIGN_STYLE=Automatic은 서버에서 프로파일을 생성/조회하려 하므로 CI에서
          # App Store Connect API 키 없이 실패한다. Manual로 강제하고 방금 import한 프로파일과 배포
          # 인증서를 명시적으로 지정한다.
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/qstory.mobileprovision
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<<"$(security cms -D -i "$PROFILE_PATH")")
          echo "Using provisioning profile: $PROFILE_NAME"
          # TestFlight는 같은 빌드 번호(CFBundleVersion)를 두 번 받지 않는다 - pbxproj의 1을 그대로 두면
          # 두 번째 업로드부터 ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE로 실패한다. 워크플로 실행 번호는
          # 단조 증가하므로 그것을 빌드 번호로 쓴다(마케팅 버전 1.0은 pbxproj 값 유지).
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -archivePath build/App.xcarchive \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
          # ExportOptions.plist도 manual + provisioningProfiles 매핑. bundle id → 프로파일 이름.
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/App.xcarchive/Info.plist 2>/dev/null || echo "kr.ai.qstory")
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export
          cp build/export/*.ipa "$GITHUB_WORKSPACE/qstory-tablet-ios.ipa"
      - uses: actions/upload-artifact@v4
        if: env.HAS_IOS_SIGNING == 'true'
        with:
          name: qstory-tablet-ios-ipa
          path: qstory-tablet-ios.ipa

      # 3) App Store Connect 업로드 - export가 app-store 방식이고 API 키 시크릿이 있을 때만.
      # altool은 ~/.appstoreconnect/private_keys/AuthKey_<KEY_ID>.p8 파일을 규약된 위치에서 찾는다.
      # 업로드 성공 뒤 App Store Connect에서 몇 분 processing → TestFlight에 빌드가 뜬다.
      - name: Upload IPA to TestFlight
        if: env.HAS_IOS_SIGNING == 'true' && env.HAS_APPSTORE_API == 'true' && env.EXPORT_METHOD == 'app-store'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$P8_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file "$GITHUB_WORKSPACE/qstory-tablet-ios.ipa" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
          # .p8은 러너 임시 파일시스템이라 잡 종료와 함께 사라지지만 명시적으로 지운다.
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
