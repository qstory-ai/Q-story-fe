# Q-31 그레텔 대화가 "지금까지 일어난 일"로 쓰는 장면별 줄거리 - 지금 장면까지만 AI에 보낸다.
sceneSynopses:
  HG-F01: 먹을 것이 부족해진 집. 새어머니의 제안에 아버지가 동의하고, 남매는 대화를 엿듣는다.
  HG-F02: 헨젤이 놓은 돌을 따라 집으로 돌아온다. 며칠 뒤 다시 숲에 두고 올 계획을 듣는다.
  HG-F03: 문이 잠겨 돌을 줍지 못한 헨젤은 빵을 대신 놓는다. 새들이 빵을 먹어 남매는 길을 잃는다.
  HG-F04: 남매를 돌아보는 새를 발견한다. 관찰하거나 말을 건 뒤 새를 따라 과자집에 도착한다.
  HG-F05: 할머니에게 길을 잃었다고 말한다. 집과 집주인을 알아본 뒤 음식과 휴식을 제안받는다.
  HG-F06: 다음 날 부엌에서 갇힌다. 그레텔은 두 열쇠가 각각 어떤 문을 여는지 알아낸다.
  HG-F07: 마녀가 요리하는 틈에 열쇠를 가져온다. 헨젤을 풀고 부엌을 빠져나와 문을 잠근다.
  HG-F08: 출구 옆에서 빵과 물을 챙겨 집 밖으로 나온다.
  HG-F09: 오리를 타고 한 명씩 물길을 건넌다. 천이 묶인 나무 쪽에서 집을 발견한다.
  HG-F10: 아버지가 잘못을 인정한다. 남매는 겪은 일을 전하고, 가족은 어려움을 함께 이야기하며 살아간다.
# Q-31 질문 초대의 도움 단계 - 아이가 요청할 때만 한 단계씩 보여 준다. 정답이나 이후 반전을 먼저 알려주지 않는다.
# A는 궁금한 것 발견하기, B는 알아보고 싶은 것을 질문으로 만들기, C는 방법 생각하기.
inviteHelp:
  HG-Q-A:
    steps:
      - 저 새가 앞으로 갔다가 우리를 다시 돌아봤어. 새를 같이 살펴볼까?
      - 새가 어디로 가는지, 왜 우리를 돌아보는지… 너는 어떤 게 더 궁금해?
      - 나는 ‘새야, 어디로 가는 거야?’라고 물어보고 싶어. 너도 알고 싶은 걸 물어봐도 돼.
  HG-Q-B:
    steps:
      - 할머니는 안에서 먹고 쉬라고 했어. 그런데 우리는 이 집과 할머니를 아직 잘 몰라.
      - 우리는 배도 고프고 집에도 돌아가고 싶잖아. 할머니에게 어떤 걸 물어보면 좋을까?
      - 예를 들면 ‘집으로 가는 길을 알려주실 수 있나요?’라고 물어볼 수 있어. 너라면 무엇을 물어보고 싶어?
    continueLine: 그럼 남매는 어떻게 했는지 이어서 볼까?
  HG-Q-C:
    steps:
      - 마녀가 두 열쇠를 작업대 끝에 내려놨어. 저 열쇠가 있어야 문을 열 수 있어.
      - 그런데 마녀가 자꾸 이쪽을 돌아봐. 지금 가져가면 들킬 수도 있겠어.
      - 마녀가 우리 쪽을 보고 있지 않을 때라면 어떨까? 그런 순간을 기다리거나 만들 수 있을까?
      - 마녀가 다른 곳을 볼 때까지 기다릴 수도 있고, 헨젤이 마녀를 불러볼 수도 있겠어. 어떤 방법으로 해보고 싶어?
    # 마지막 단계에서만 보여 주는 방법 예시. 아이가 혼자 생각한 방법과 구분해 "예시 후 선택"으로 기록한다.
