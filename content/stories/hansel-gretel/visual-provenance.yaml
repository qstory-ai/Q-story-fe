# 지금부터 새로 만드는 삽화는 예외 없이 RECOVERED로 기록한다(②npm run visual:brief 실행 시점에
# prompt/model/inputHash를 그대로 옮겨 적으면 된다) - 41장 전체에 대한 소급 기록은 별도 콘텐츠
# 운영 태스크로 남겨둔다(이 파일은 그 전수조사의 첫 표본).
